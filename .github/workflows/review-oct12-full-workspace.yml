# Disposable review evidence only. Close this PR after validation; never merge.
name: review exact heads full workspace

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths: [.github/workflows/review-oct12-full-workspace.yml]

permissions:
  contents: read

concurrency:
  group: review-oct12-full-workspace-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  exact-head-tests:
    # Only this dedicated same-repository validation branch may run these jobs.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'verify/review-oct12-full-workspace' && !github.event.pull_request.draft
    name: full workspace PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 3424
            sha: e709526ea4aa8307ec1e43bcebd0045f77e21cf2
          - pr: 3409
            sha: 2dcb364fcae79a75a3df3e75dbda9221f9be9772
            source: 3856a50e9431075185bf6b2d2ca346fd4fab9591
            base: e41c9c4c6ccabf700f1dfdc1653e7ef9c5e96312
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify and record the reviewed revision
        env:
          EXPECTED_HEAD: ${{ matrix.sha }}
          REVIEWED_PR: ${{ matrix.pr }}
          EXPECTED_SOURCE: ${{ matrix.source }}
          EXPECTED_BASE: ${{ matrix.base }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "PR $REVIEWED_PR: $EXPECTED_HEAD" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$EXPECTED_SOURCE" ]; then
            test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
            test "$(git rev-parse HEAD^2)" = "$EXPECTED_SOURCE"
            echo "Integration revision: source $EXPECTED_SOURCE; base $EXPECTED_BASE" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: test-shards
          save-if: false
      - name: Install uv
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build workspace binaries for integration tests
        run: cargo build --locked --workspace --bins
      - name: Bootstrap kernel environment before tests
        run: ./target/debug/prime-agent --prime-agent-bootstrap
      - name: Test the entire workspace
        run: cargo test --locked --workspace

  validation-result:
    name: exact reviewed heads complete
    if: always()
    needs: exact-head-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Require every pinned-head job to pass
        run: test "${{ needs.exact-head-tests.result }}" = success
